[advisories]
ignore = [
    "RUSTSEC-2024-0437",  # protobuf — transitive dep, upgrade requires major version bump
    "RUSTSEC-2023-0071",  # rsa — no patch available
    "RUSTSEC-2024-0363",  # sqlx — 0.8 upgrade tracked separately
    "RUSTSEC-2026-0002",  # lru — unsound IterMut, no patch yet

    # rustls-webpki 0.101.7 via reqwest 0.11 / sqlx 0.7 / rustls 0.21 chain.
    # Fix requires upgrading sqlx 0.7->0.8 (tracked via RUSTSEC-2024-0363) and
    # reqwest 0.11->0.12. The name-constraint bugs (0098/0099) only affect clients
    # that validate certificates with constrained URI/wildcard names from untrusted
    # CAs; we connect only to Supabase and known vendor APIs.  The CRL-panic
    # (0104) requires an attacker to supply a malformed CRL, which is not reachable
    # in our server-to-server TLS usage.  Review date: 2026-04-24.
    "RUSTSEC-2026-0098",  # rustls-webpki — URI name constraint validation; blocked on sqlx/reqwest major upgrade
    "RUSTSEC-2026-0099",  # rustls-webpki — wildcard name constraint; blocked on sqlx/reqwest major upgrade
    "RUSTSEC-2026-0104",  # rustls-webpki — CRL parse panic; not reachable without CRL revocation; blocked on sqlx/reqwest major upgrade
]
