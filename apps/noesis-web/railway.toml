[build]
builder = "NIXPACKS"

[build.nixpacksPlan]
# Build the Next.js standalone app
providers = ["node"]

[deploy]
startCommand = "node .next/standalone/server.js"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[variables]
PORT = "3002"
NEXT_PUBLIC_RAAGA_V2_ENABLED = "true"
