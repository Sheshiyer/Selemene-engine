d glass</span></span><span class="iso-caption">Two witnesses face each other across a rail. The lamp is the question; the mirror it is nearer speaks, lit in its own colour, while the other dims to 35%. At the midpoint both hold half and the chamber reads held · both. The readout's share is the lamp's distance from the far mirror over the whole gap.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
