<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Consent lifecycle</title>
  <desc id="desc">Circular lifecycle showing grant, scope, use, display, retention, revision, revocation, and refusal for sensitive material.</desc>
  <defs><style>.bg{fill:#11131a}.node{fill:#1a2030;stroke:#d9b778;stroke-width:2.4}.center{fill:#241d2b;stroke:#f0cf86;stroke-width:3}.line{stroke:#7894c8;stroke-width:2.5}.title{font:700 40px Georgia,serif;fill:#f5dfaa}.label{font:700 20px Inter,Arial,sans-serif;fill:#f8e7bd}.small{font:16px Inter,Arial,sans-serif;fill:#d8c7b0}</style></defs>
  <rect class="bg" width="1320" height="760"/>
  <text class="title" x="660" y="64" text-anchor="middle">Consent as Lifecycle</text>
  <circle class="center" cx="660" cy="390" r="118"/>
  <text class="label" x="660" y="378" text-anchor="middle">Sensitive</text><text class="label" x="660" y="407" text-anchor="middle">material</text>
  <g><line class="line" x1="660" y1="272" x2="660" y2="160"/><rect class="node" x="565" y="110" width="190" height="70" rx="18"/><text class="label" x="660" y="153" text-anchor="middle">Grant</text></g>
  <g><line class="line" x1="745" y1="306" x2="890" y2="190"/><rect class="node" x="870" y="140" width="190" height="70" rx="18"/><text class="label" x="965" y="183" text-anchor="middle">Scope</text></g>
  <g><line class="line" x1="778" y1="390" x2="1010" y2="390"/><rect class="node" x="1000" y="355" width="190" height="70" rx="18"/><text class="label" x="1095" y="398" text-anchor="middle">Use</text></g>
  <g><line class="line" x1="744" y1="475" x2="890" y2="590"/><rect class="node" x="870" y="560" width="190" height="70" rx="18"/><text class="label" x="965" y="603" text-anchor="middle">Display</text></g>
  <g><line class="line" x1="660" y1="508" x2="660" y2="620"/><rect class="node" x="565" y="600" width="190" height="70" rx="18"/><text class="label" x="660" y="643" text-anchor="middle">Retention</text></g>
  <g><line class="line" x1="576" y1="475" x2="430" y2="590"/><rect class="node" x="260" y="560" width="190" height="70" rx="18"/><text class="label" x="355" y="603" text-anchor="middle">Revision</text></g>
  <g><line class="line" x1="542" y1="390" x2="310" y2="390"/><rect class="node" x="130" y="355" width="190" height="70" rx="18"/><text class="label" x="225" y="398" text-anchor="middle">Revocation</text></g>
  <g><line class="line" x1="575" y1="306" x2="430" y2="190"/><rect class="node" x="260" y="140" width="190" height="70" rx="18"/><text class="label" x="355" y="183" text-anchor="middle">Refusal</text></g>
  <text class="small" x="660" y="716" text-anchor="middle">Consent persists only while scope, freshness, and allowed use remain intact.</text>
</svg>
