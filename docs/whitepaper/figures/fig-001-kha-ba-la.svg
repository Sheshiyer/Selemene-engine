<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Kha-Ba-La three-force grammar</title>
  <desc id="desc">A triangular diagram showing Kha as observing field, Ba as embodied medium, and La as boundary and form converging into an authored mirror.</desc>
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#f7e7b6" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#b7834d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2a1d28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#d9b778"/>
      <stop offset="100%" stop-color="#6f4d7c"/>
    </linearGradient>
    <style>
      .bg{fill:#130f18}
      .ring{fill:none;stroke:#d9b778;stroke-width:2;opacity:.45}
      .line{stroke:url(#edge);stroke-width:3;fill:none;opacity:.85}
      .node{fill:#21192a;stroke:#e8c982;stroke-width:3}
      .center{fill:#261c25;stroke:#f0cf86;stroke-width:3}
      .title{font:700 42px Georgia,serif;fill:#f5dfaa}
      .label{font:700 34px Georgia,serif;fill:#f8e7bd}
      .small{font:18px Inter,Arial,sans-serif;fill:#d8c7b0}
      .caption{font:20px Inter,Arial,sans-serif;fill:#e7d7be}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760" rx="0"/>
  <circle cx="600" cy="392" r="286" fill="url(#centerGlow)"/>
  <circle class="ring" cx="600" cy="392" r="260"/>
  <circle class="ring" cx="600" cy="392" r="188"/>
  <path class="line" d="M600 126 L300 560 L900 560 Z"/>
  <path class="line" d="M600 196 L374 520"/>
  <path class="line" d="M600 196 L826 520"/>
  <path class="line" d="M374 520 L826 520"/>
  <circle class="node" cx="600" cy="126" r="104"/>
  <circle class="node" cx="300" cy="560" r="104"/>
  <circle class="node" cx="900" cy="560" r="104"/>
  <circle class="center" cx="600" cy="392" r="120"/>
  <text class="title" x="600" y="58" text-anchor="middle">Kha-Ba-La as Reflective Grammar</text>
  <text class="label" x="600" y="120" text-anchor="middle">Kha</text>
  <text class="small" x="600" y="154" text-anchor="middle">observer</text>
  <text class="small" x="600" y="180" text-anchor="middle">author-drive</text>
  <text class="label" x="300" y="554" text-anchor="middle">Ba</text>
  <text class="small" x="300" y="588" text-anchor="middle">body</text>
  <text class="small" x="300" y="614" text-anchor="middle">medium</text>
  <text class="label" x="900" y="554" text-anchor="middle">La</text>
  <text class="small" x="900" y="588" text-anchor="middle">boundary</text>
  <text class="small" x="900" y="614" text-anchor="middle">form</text>
  <text class="label" x="600" y="376" text-anchor="middle">Authored</text>
  <text class="label" x="600" y="418" text-anchor="middle">Mirror</text>
  <text class="caption" x="600" y="704" text-anchor="middle">Observation, embodiment, and constraint converge into a mirror the practitioner can question.</text>
</svg>
