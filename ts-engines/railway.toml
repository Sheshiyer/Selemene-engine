[build]
# builder = DOCKERFILE matches live manifest and ts-engines/railway.json.
# docs/plans/selemene-engine/RECOVERY-2026-09-05.md
builder = "DOCKERFILE"
# Dockerfile is in current directory (when root is /ts-engines)
dockerfilePath = "Dockerfile"
# watchPatterns are repo-root relative (Root Directory does not re-base paths).
# docs/plans/selemene-engine/RECOVERY-2026-09-05.md
watchPatterns = [
 "ts-engines/src/**",
 "ts-engines/package.json",
 "ts-engines/bun.lock",
 "ts-engines/Dockerfile",
 "ts-engines/railway.toml",
 "ts-engines/railway.json"
]

[deploy]
# Start command (Dockerfile already defines this)
# startCommand = "bun run src/index.ts"

# Healthcheck endpoint
healthcheckPath = "/health"
healthcheckTimeout = 60

# Restart policy - restart on failure
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
