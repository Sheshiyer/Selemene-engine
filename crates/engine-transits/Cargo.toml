[package]
name = "engine-transits"
version = "0.1.0"
edition = "2021"
description = "Transit analysis consciousness engine — planetary transits, natal aspects, Sade Sati"

[dependencies]
noesis-core = { path = "../noesis-core" }
engine-human-design = { path = "../engine-human-design" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }
