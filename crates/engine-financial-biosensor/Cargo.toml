[package]
name = "engine-financial-biosensor"
version.workspace = true
edition = "2021"
description = "Financial Biosensor engine — a decision-reflection surface composed over five consciousness engines and one optional biometric sample"

[dependencies]
noesis-core = { path = "../noesis-core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }
