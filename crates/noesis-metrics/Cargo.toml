[package]
name = "noesis-metrics"
version.workspace = true
edition = "2021"
description = "Prometheus metrics collection and OpenTelemetry tracing for Noesis platform"

[dependencies]
prometheus = "0.13"
lazy_static = "1.4"
tokio = { version = "1.0", features = ["time", "rt"] }
tracing = "0.1"
sysinfo = "0.32"
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic"] }

[features]
default = []
jaeger = []
