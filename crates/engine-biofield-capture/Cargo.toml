[package]
name = "engine-biofield-capture"
version.workspace = true
edition = "2021"
description = "Capture-derived biofield engine for persisted reading lookup"

[dependencies]
noesis-core = { path = "../noesis-core" }
noesis-data = { path = "../noesis-data" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json", "macros"] }
uuid = { version = "1.7", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
