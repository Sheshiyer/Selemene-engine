[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.biofield"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.watch]
include = [
  "biofield_cv_service/**",
  "shared/**",
  "pyproject.toml",
  "Dockerfile.biofield",
]
exclude = [
  "*.md",
  "tests/**",
  "mediapipe_service/**",
  "Dockerfile.mediapipe",
]
