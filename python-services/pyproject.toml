[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selemene-python-services"
version = "0.1.0"
description = "Python sidecar services for Selemene Engine (MediaPipe + Biofield CV)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "python-multipart>=0.0.6",
    "numpy>=1.26",
    "pydantic>=2.5",
]

[project.optional-dependencies]
mediapipe = [
    "mediapipe>=0.10",
    "opencv-python-headless>=4.8",
]
dev = [
    "pytest>=7.4",
    "httpx>=0.25",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mediapipe-service = "mediapipe_service.main:start"
biofield-cv-service = "biofield_cv_service.main:start"

[tool.hatch.build.targets.wheel]
packages = ["mediapipe_service", "biofield_cv_service", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
