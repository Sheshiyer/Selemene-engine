name: CD - Build & Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository_owner }}/selemene-engine
  IMAGE_NAME_TS: ${{ github.repository_owner }}/selemene-ts-engines

jobs:
  # Build and push Rust API Docker image
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # swisseph currently fails to compile on arm64 in this Docker build path
          # (libswisseph-sys pointer type mismatch under buildx/qemu). Keep deploys
          # deterministic on amd64 until arm64 toolchain/dependency parity is fixed.
          platforms: linux/amd64
      
      - name: Check image size
        run: |
          IMAGE_REF=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Inspecting image: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"
          SIZE=$(docker image inspect "${IMAGE_REF}" --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 500 ]; then
            echo "::warning::Image size (${SIZE_MB}MB) exceeds 500MB target"
          fi

  # Build and push TypeScript engines Docker image
  build-ts-engines:
    name: Build TS Engines Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TS }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./ts-engines
          file: ./ts-engines/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Kubernetes
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-api, build-ts-engines]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: https://api.selemene.witnessos.io
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
      
      - name: Configure kubectl
        run: |
          if [ -n "${{ secrets.KUBECONFIG }}" ]; then
            echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
            echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
            echo "HAS_KUBECONFIG=true" >> $GITHUB_ENV
          else
            echo "HAS_KUBECONFIG=false" >> $GITHUB_ENV
            echo "No KUBECONFIG secret configured; skipping cluster deploy steps."
          fi
      
      - name: Update image tags
        run: |
          cd k8s
          kustomize edit set image \
            ghcr.io/witnessos/selemene-engine=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:sha-${{ github.sha }} \
            ghcr.io/witnessos/selemene-ts-engines=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TS }}:sha-${{ github.sha }}
      
      - name: Render manifests
        run: |
          cd k8s
          kustomize build . > /tmp/manifests.yaml

      - name: Validate manifests
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          kubectl apply --dry-run=client -f /tmp/manifests.yaml

      - name: Skip cluster deploy (no kubeconfig)
        if: env.HAS_KUBECONFIG != 'true'
        run: |
          echo "KUBECONFIG secret is not configured; skipping Kubernetes validation and deploy."
      
      - name: Deploy to cluster
        run: |
          cd k8s
          kustomize build . | kubectl apply -f -
        if: env.HAS_KUBECONFIG == 'true'
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/selemene-api -n selemene --timeout=300s
          kubectl rollout status deployment/selemene-ts-engines -n selemene --timeout=300s
        if: env.HAS_KUBECONFIG == 'true'
      
      - name: Verify deployment
        run: |
          # Check pods are running
          kubectl get pods -n selemene -l app=selemene
          
          # Check endpoints are ready
          kubectl get endpoints -n selemene
        if: env.HAS_KUBECONFIG == 'true'

  # Deploy to Railway (optional, gated by secrets)
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [build-api]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'Selemene-engine' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Railway configuration
        run: |
          if [[ -z "${RAILWAY_TOKEN}" || -z "${RAILWAY_PROJECT_ID}" ]]; then
            echo "RAILWAY_TOKEN or RAILWAY_PROJECT_ID not configured; skipping Railway deploy."
            exit 0
          fi

      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: npm install -g @railway/cli

      - name: Deploy to Railway service
        if: env.RAILWAY_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: |
          railway --version
          railway link -p "${RAILWAY_PROJECT_ID}" -e "${RAILWAY_ENVIRONMENT}" -s "${RAILWAY_SERVICE}"
          railway up --ci --detach

      - name: Verify Railway health
        if: env.RAILWAY_TOKEN != '' && env.RAILWAY_PROJECT_ID != ''
        run: |
          railway link -p "${RAILWAY_PROJECT_ID}" -e "${RAILWAY_ENVIRONMENT}" -s "${RAILWAY_SERVICE}"
          RAILWAY_STATUS=$(railway status 2>&1)
          RAILWAY_URL=$(echo "${RAILWAY_STATUS}" | grep -oE "https://[a-zA-Z0-9.-]+\.railway\.app" | head -1 || true)
          if [[ -z "${RAILWAY_URL}" ]]; then
            echo "Could not determine Railway service URL from railway status output."
            echo "Status output:"
            echo "${RAILWAY_STATUS}"
            exit 1
          fi

          echo "Checking Railway health at ${RAILWAY_URL}/health/live"
          for attempt in {1..12}; do
            STATUS_CODE=$(curl -sS -o /tmp/railway-health.json -w "%{http_code}" "${RAILWAY_URL}/health/live" || echo "000")
            if [[ "${STATUS_CODE}" == "200" ]]; then
              echo "Railway health check passed on attempt ${attempt}."
              cat /tmp/railway-health.json
              exit 0
            fi

            echo "Attempt ${attempt}/12: health returned ${STATUS_CODE}; retrying in 10s..."
            sleep 10
          done

          echo "Railway health check failed after retries."
          cat /tmp/railway-health.json || true
          exit 1

  # Post-deploy admin surface smoke check (frontend + backend)
  smoke-test:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy, deploy-railway]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SMOKE_TEST_JWT: ${{ secrets.SMOKE_TEST_JWT }}
      SMOKE_TEST_API_KEY: ${{ secrets.SMOKE_TEST_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate smoke env configuration
        id: smoke-gate
        run: |
          if [[ -z "${API_BASE_URL}" ]]; then
            echo "API_BASE_URL not configured as repository variable; skipping smoke tests."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${SMOKE_TEST_JWT}" && -z "${SMOKE_TEST_API_KEY}" ]]; then
            echo "SMOKE_TEST_JWT or SMOKE_TEST_API_KEY not configured; skipping protected smoke checks."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run API smoke runner
        if: steps.smoke-gate.outputs.skip != 'true'
        run: bash scripts/smoke-test-runner.sh "${API_BASE_URL}"

  admin-smoke:
    name: Admin Smoke Checks
    runs-on: ubuntu-latest
    needs: [deploy, deploy-railway]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      ADMIN_WEB_URL: ${{ vars.ADMIN_WEB_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate smoke env configuration
        run: |
          if [[ -z "${ADMIN_WEB_URL}" || -z "${API_BASE_URL}" ]]; then
            echo "ADMIN_WEB_URL or API_BASE_URL not configured as repository variables; skipping smoke checks."
            exit 0
          fi

      - name: Run admin smoke script
        if: env.ADMIN_WEB_URL != '' && env.API_BASE_URL != ''
        run: bash scripts/smoke_admin_web.sh

  # Deploy noesis-web to Vercel production
  deploy-noesis-web:
    name: Deploy noesis-web (Vercel)
    runs-on: ubuntu-latest
    needs: [build-api]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace apps/noesis-web

      - name: Deploy to Vercel production
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/noesis-web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Create GitHub Release for tags
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-api, deploy, smoke-test, admin-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## Docker Images
            
            - API: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ github.ref_name }}`
            - TS Engines: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TS }}:${{ github.ref_name }}`
            
            ## Deploy
            
            ```bash
            # Pull latest images
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TS }}:${{ github.ref_name }}
            
            # Or deploy to Kubernetes
            kubectl set image deployment/selemene-api \
              selemene-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ github.ref_name }} \
              -n selemene
            ```
