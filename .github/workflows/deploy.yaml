name: CD - Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository_owner }}/selemene-engine
  IMAGE_NAME_TS: ${{ github.repository_owner }}/selemene-ts-engines

jobs:
  validation:
    name: Required CI
    uses: ./.github/workflows/test.yml
    secrets: inherit

  validate-source:
    name: Validate Source SHA
    runs-on: ubuntu-latest
    needs: validation
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Witness exact source revision
        id: source
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Checked out ${actual_sha}, expected triggering SHA ${GITHUB_SHA}."
            exit 1
          fi
          echo "sha=${actual_sha}" >> "$GITHUB_OUTPUT"

  # Build candidate images without registry output. Their content digests are
  # inputs to the operational receipt gate; no image tag or build record is
  # published from these jobs.
  prebuild-api:
    name: Prebuild API Image
    runs-on: ubuntu-latest
    needs: validate-source
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-source.outputs.source-sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=ref,event=branch
            type=raw,value=sha-${{ needs.validate-source.outputs.source-sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build candidate without publication
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Dockerfile.prod
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-source.outputs.source-sha }}
          cache-from: type=gha
          platforms: linux/amd64
          provenance: false

  prebuild-ts-engines:
    name: Prebuild TypeScript Engines Image
    runs-on: ubuntu-latest
    needs: validate-source
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-source.outputs.source-sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TS }}
          tags: |
            type=ref,event=branch
            type=raw,value=sha-${{ needs.validate-source.outputs.source-sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build candidate without publication
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./ts-engines
          file: ./ts-engines/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-source.outputs.source-sha }}
          cache-from: type=gha
          platforms: linux/amd64
          provenance: false

  # A source-bound receipt is required before this workflow can publish an
  # image, mutate a deployment, or create a release. The receipt is public
  # metadata supplied as base64 in a repository variable; it contains no
  # credentials. Missing, unavailable, stale, or mismatched evidence fails the
  # workflow before any provider mutation begins.
  validate-release-receipt:
    name: Validate Release Receipt
    runs-on: ubuntu-latest
    needs: [validate-source, prebuild-api, prebuild-ts-engines]
    outputs:
      railway_api_project_id: ${{ steps.receipt.outputs.railway_api_project_id }}
      railway_api_environment_id: ${{ steps.receipt.outputs.railway_api_environment_id }}
      railway_api_service_id: ${{ steps.receipt.outputs.railway_api_service_id }}
      railway_api_source_root: ${{ steps.receipt.outputs.railway_api_source_root }}
      railway_api_config_path: ${{ steps.receipt.outputs.railway_api_config_path }}
      railway_typescript_engines_project_id: ${{ steps.receipt.outputs.railway_typescript_engines_project_id }}
      railway_typescript_engines_environment_id: ${{ steps.receipt.outputs.railway_typescript_engines_environment_id }}
      railway_typescript_engines_service_id: ${{ steps.receipt.outputs.railway_typescript_engines_service_id }}
      railway_typescript_engines_source_root: ${{ steps.receipt.outputs.railway_typescript_engines_source_root }}
      railway_typescript_engines_config_path: ${{ steps.receipt.outputs.railway_typescript_engines_config_path }}
    env:
      RELEASE_RECEIPT_B64: ${{ vars.DEPLOY_RELEASE_RECEIPT_B64 }}
      REQUESTED_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      ENABLE_K8S_DEPLOY: ${{ vars.ENABLE_K8S_DEPLOY }}
      EXPECTED_API_DIGEST: ${{ needs.prebuild-api.outputs.image-digest }}
      EXPECTED_TS_DIGEST: ${{ needs.prebuild-ts-engines.outputs.image-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-source.outputs.source-sha }}

      - name: Materialize candidate release receipt
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_RECEIPT_B64:-}" ]]; then
            echo "::error title=Release receipt missing::Set vars.DEPLOY_RELEASE_RECEIPT_B64 to a reviewed v1 deploy-production receipt for this exact source revision and prebuilt digests."
            exit 1
          fi
          umask 077
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "selemene-release-receipt.json").write_bytes(base64.b64decode(os.environ["RELEASE_RECEIPT_B64"], validate=True))'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install receipt validator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-gates.txt

      - name: Validate source-bound release receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REQUESTED_ENVIRONMENT}" != "production" ]]; then
            echo "::error title=Target profile unavailable::No staging service/schema/rollback target profile is authoritative; production receipt validation cannot authorize ${REQUESTED_ENVIRONMENT}."
            exit 1
          fi
          if [[ "${ENABLE_K8S_DEPLOY:-false}" == "true" ]]; then
            echo "::error title=Kubernetes target unauthorized::The current receipt authority covers active Railway and GHCR targets only. Add an exact Kubernetes target profile before enabling this job."
            exit 1
          fi
          python3 scripts/validate_release_receipt.py \
            "$RUNNER_TEMP/selemene-release-receipt.json" \
            --expected-source "$GITHUB_SHA" \
            --expected-operation-id "github-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --expected-workflow .github/workflows/deploy.yaml \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --required-promotion-mode source-redeploy \
            --target-profile deploy-production \
            --expected-artifact-digest "api=${EXPECTED_API_DIGEST}" \
            --expected-artifact-digest "typescript-engines=${EXPECTED_TS_DIGEST}" \
            --github-output "$GITHUB_OUTPUT" \
            --operational

  # Build and push Rust API Docker image
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: [validate-source, prebuild-api, validate-release-receipt]
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-source.outputs.source-sha }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ needs.validate-source.outputs.source-sha }}
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build API image locally
        id: build
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-source.outputs.source-sha }}
          cache-from: type=gha
          # swisseph currently fails to compile on arm64 in this Docker build path
          # (libswisseph-sys pointer type mismatch under buildx/qemu). Keep deploys
          # deterministic on amd64 until arm64 toolchain/dependency parity is fixed.
          platforms: linux/amd64
          provenance: false

      - name: Verify local API digest matches receipt
        run: |
          if [[ "${{ steps.build.outputs.digest }}" != "${{ needs.prebuild-api.outputs.image-digest }}" ]]; then
            echo "::error title=Local digest drift::API image differs from the prepublication digest authorized by the receipt; no registry tag was changed."
            exit 1
          fi

      - name: Publish validated API image
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r image_tag; do
            [[ -n "${image_tag}" ]] && docker push "${image_tag}"
          done <<< "${{ steps.meta.outputs.tags }}"
      
      - name: Check image size
        run: |
          IMAGE_REF=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Inspecting image: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"
          SIZE=$(docker image inspect "${IMAGE_REF}" --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 500 ]; then
            echo "::warning::Image size (${SIZE_MB}MB) exceeds 500MB target"
          fi

  # Build and push TypeScript engines Docker image
  build-ts-engines:
    name: Build TS Engines Image
    runs-on: ubuntu-latest
    needs: [validate-source, prebuild-ts-engines, validate-release-receipt]
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-source.outputs.source-sha }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TS }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=sha-${{ needs.validate-source.outputs.source-sha }}
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build TypeScript image locally
        id: build
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./ts-engines
          file: ./ts-engines/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-source.outputs.source-sha }}
          cache-from: type=gha
          platforms: linux/amd64
          provenance: false

      - name: Verify local TypeScript digest matches receipt
        run: |
          if [[ "${{ steps.build.outputs.digest }}" != "${{ needs.prebuild-ts-engines.outputs.image-digest }}" ]]; then
            echo "::error title=Local digest drift::TypeScript image differs from the prepublication digest authorized by the receipt; no registry tag was changed."
            exit 1
          fi

      - name: Publish validated TypeScript image
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r image_tag; do
            [[ -n "${image_tag}" ]] && docker push "${image_tag}"
          done <<< "${{ steps.meta.outputs.tags }}"

  # Deploy to Kubernetes — OPT-IN, and currently dormant.
  #
  # This cluster is not the live target: api.selemene.witnessos.io does not
  # resolve, and the running engine is served by Railway. The job previously ran
  # on every push and reported success while every step self-skipped for a
  # missing KUBECONFIG — a green tick for a deploy to a host that isn't there.
  # Enable it deliberately with vars.ENABLE_K8S_DEPLOY=true (and set KUBECONFIG),
  # at which point a missing kubeconfig is a hard failure.
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [validate-source, validate-release-receipt, build-api, build-ts-engines]
    if: |
      vars.ENABLE_K8S_DEPLOY == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ vars.K8S_ENVIRONMENT_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-source.outputs.source-sha }}
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3
        with:
          version: 'v1.28.0'
      
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2
      
      # The job only runs when K8s deploys are explicitly enabled, so a missing
      # kubeconfig is a misconfiguration — not a reason to pass quietly.
      - name: Configure kubectl
        run: |
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "::error title=KUBECONFIG missing::vars.ENABLE_K8S_DEPLOY is true but no KUBECONFIG secret is set, so this job would report success without deploying."
            exit 1
          fi
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> "$GITHUB_ENV"
      
      - name: Update image tags
        run: |
          cd k8s
          kustomize edit set image \
            ghcr.io/witnessos/selemene-engine=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:sha-${{ needs.validate-source.outputs.source-sha }} \
            ghcr.io/witnessos/selemene-ts-engines=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TS }}:sha-${{ needs.validate-source.outputs.source-sha }}
      
      - name: Render manifests
        run: |
          cd k8s
          kustomize build . > /tmp/manifests.yaml

      - name: Validate manifests
        run: |
          kubectl apply --dry-run=client -f /tmp/manifests.yaml

      - name: Deploy to cluster
        run: |
          cd k8s
          kustomize build . | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/selemene-api -n selemene --timeout=300s
          kubectl rollout status deployment/selemene-ts-engines -n selemene --timeout=300s

      - name: Verify deployment
        run: |
          # Check pods are running
          kubectl get pods -n selemene -l app=selemene

          # Check endpoints are ready
          kubectl get endpoints -n selemene

  # Deploy to Railway — the live engine's actual target.
  # Runs unless deploys are explicitly disabled (vars.DEPLOY_TARGET=none).
  # Missing credentials FAIL the job rather than skipping it silently.
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [validate-source, validate-release-receipt, build-api, build-ts-engines]
    if: |
      vars.DEPLOY_TARGET != 'none' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_PROJECT_ID: ${{ needs.validate-release-receipt.outputs.railway_api_project_id }}
      RAILWAY_API_ENVIRONMENT_ID: ${{ needs.validate-release-receipt.outputs.railway_api_environment_id }}
      RAILWAY_API_SERVICE_ID: ${{ needs.validate-release-receipt.outputs.railway_api_service_id }}
      RAILWAY_API_SOURCE_ROOT: ${{ needs.validate-release-receipt.outputs.railway_api_source_root }}
      RAILWAY_API_CONFIG_PATH: ${{ needs.validate-release-receipt.outputs.railway_api_config_path }}
      RAILWAY_TS_PROJECT_ID: ${{ needs.validate-release-receipt.outputs.railway_typescript_engines_project_id }}
      RAILWAY_TS_ENVIRONMENT_ID: ${{ needs.validate-release-receipt.outputs.railway_typescript_engines_environment_id }}
      RAILWAY_TS_SERVICE_ID: ${{ needs.validate-release-receipt.outputs.railway_typescript_engines_service_id }}
      RAILWAY_TS_SOURCE_ROOT: ${{ needs.validate-release-receipt.outputs.railway_typescript_engines_source_root }}
      RAILWAY_TS_CONFIG_PATH: ${{ needs.validate-release-receipt.outputs.railway_typescript_engines_config_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-source.outputs.source-sha }}

      # Railway serves the live engine (selemene.tryambakam.space). If its
      # credentials are absent this job used to `exit 0` — reporting a green
      # deploy while shipping nothing. That is exactly how a merged fix sat
      # unshipped behind an all-green CD run. A deploy that cannot deploy is a
      # failure, not a pass.
      - name: Validate Railway configuration
        run: |
          required_values=(
            RAILWAY_TOKEN
            RAILWAY_API_PROJECT_ID RAILWAY_API_ENVIRONMENT_ID RAILWAY_API_SERVICE_ID RAILWAY_API_SOURCE_ROOT RAILWAY_API_CONFIG_PATH
            RAILWAY_TS_PROJECT_ID RAILWAY_TS_ENVIRONMENT_ID RAILWAY_TS_SERVICE_ID RAILWAY_TS_SOURCE_ROOT RAILWAY_TS_CONFIG_PATH
          )
          for name in "${required_values[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Railway not configured::${name} is missing; the multi-service deployment cannot start."
              exit 1
            fi
          done
          if [[ "${RAILWAY_API_PROJECT_ID}" != "${RAILWAY_TS_PROJECT_ID}" || "${RAILWAY_API_ENVIRONMENT_ID}" != "${RAILWAY_TS_ENVIRONMENT_ID}" ]]; then
            echo "::error title=Railway target mismatch::API and TypeScript services must share the manifest-authorized project and environment."
            exit 1
          fi
          [[ -d "${RAILWAY_API_SOURCE_ROOT}" && -f "${RAILWAY_API_CONFIG_PATH}" ]]
          [[ -d "${RAILWAY_TS_SOURCE_ROOT}" && -f "${RAILWAY_TS_CONFIG_PATH}" ]]

      - name: Verify Railway token scope
        shell: bash
        run: |
          set -euo pipefail
          scope_json="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Project-Access-Token: ${RAILWAY_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')"
          actual_project_id="$(jq -er '.data.projectToken.projectId' <<< "${scope_json}")"
          actual_environment_id="$(jq -er '.data.projectToken.environmentId' <<< "${scope_json}")"
          if [[ "${actual_project_id}" != "${RAILWAY_API_PROJECT_ID}" || "${actual_environment_id}" != "${RAILWAY_API_ENVIRONMENT_ID}" ]]; then
            echo "::error title=Railway token scope mismatch::The project token is not scoped to the manifest-authorized production project and environment."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.41.0

      - name: Deploy to Railway services
        run: |
          railway --version
          (
            cd "${RAILWAY_API_SOURCE_ROOT}"
            railway up \
              --project "${RAILWAY_API_PROJECT_ID}" \
              --environment "${RAILWAY_API_ENVIRONMENT_ID}" \
              --service "${RAILWAY_API_SERVICE_ID}" \
              --ci
          )
          (
            cd "${RAILWAY_TS_SOURCE_ROOT}"
            railway up \
              --project "${RAILWAY_TS_PROJECT_ID}" \
              --environment "${RAILWAY_TS_ENVIRONMENT_ID}" \
              --service "${RAILWAY_TS_SERVICE_ID}" \
              --ci
          )

      - name: Verify Railway health
        env:
          HEALTH_BASE: ${{ vars.API_BASE_URL }}
        run: |
          # A project token can't run `railway status` to discover the .railway.app
          # URL (also an account op), so verify the real production endpoint
          # (custom domain) directly.
          BASE="${HEALTH_BASE:-https://selemene.tryambakam.space}"
          echo "Checking ${BASE}/health/live after deploy..."
          for attempt in {1..18}; do
            STATUS_CODE=$(curl -sS -o /tmp/railway-health.json -w "%{http_code}" "${BASE}/health/live" || echo "000")
            if [[ "${STATUS_CODE}" == "200" ]]; then
              echo "Health check passed on attempt ${attempt}."
              cat /tmp/railway-health.json
              exit 0
            fi
            echo "Attempt ${attempt}/18: health returned ${STATUS_CODE}; retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after retries."
          cat /tmp/railway-health.json || true
          exit 1

  # Post-deploy verification. Runs after the Railway deploy — the K8s job being
  # skipped (opt-in) must NOT cascade-skip this, or the mode-contract gate below
  # silently never runs, which is the very failure this file is closing.
  smoke-test:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    needs: [validate-source, deploy, deploy-railway]
    if: |
      always() &&
      needs.validate-source.result == 'success' &&
      needs.deploy-railway.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SMOKE_TEST_JWT: ${{ secrets.SMOKE_TEST_JWT }}
      SMOKE_TEST_API_KEY: ${{ secrets.SMOKE_TEST_API_KEY }}
      SKIP_SMOKE: ${{ vars.SKIP_SMOKE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-source.outputs.source-sha }}

      # A deploy with no post-deploy verification is a deploy you can't trust —
      # so missing config FAILS rather than skipping. Opt out deliberately with
      # vars.SKIP_SMOKE=true if this repo genuinely has nothing to verify.
      - name: Validate smoke env configuration
        id: smoke-gate
        run: |
          if [[ "${SKIP_SMOKE}" == "true" ]]; then
            echo "::warning title=Smoke skipped::vars.SKIP_SMOKE=true — post-deploy verification is explicitly disabled."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${API_BASE_URL}" || ( -z "${SMOKE_TEST_JWT}" && -z "${SMOKE_TEST_API_KEY}" ) ]]; then
            echo "::error title=Smoke not configured::A deploy ran but cannot be verified — set vars.API_BASE_URL and secrets.SMOKE_TEST_JWT (or SMOKE_TEST_API_KEY), or set vars.SKIP_SMOKE=true to opt out deliberately."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run API smoke runner
        if: steps.smoke-gate.outputs.skip != 'true'
        run: bash scripts/smoke-test-runner.sh "${API_BASE_URL}"

      # The mode contract is checked against the DEPLOYED engine, not just in
      # `cargo test`. Those drifted before and nobody noticed: /assets/generate
      # answered every mode with a generic "default: Reading", so a typo'd mode
      # was indistinguishable from a real reading and a whole fake surface looked
      # healthy. Unit tests can't catch "green locally, not shipped".
      - name: Verify mode contract on the deployed engine
        if: steps.smoke-gate.outputs.skip != 'true'
        env:
          ENGINE_URL: ${{ vars.API_BASE_URL }}
          # The engine takes a Bearer JWT or an X-API-Key; the gate uses whichever
          # is provided, so the Selemene API key works here too.
          ENGINE_TOKEN: ${{ secrets.SMOKE_TEST_JWT }}
          ENGINE_API_KEY: ${{ secrets.SMOKE_TEST_API_KEY }}
        run: node scripts/verify-mode-contract.mjs "${ENGINE_URL}"

  admin-smoke:
    name: Admin Smoke Checks
    runs-on: ubuntu-latest
    needs: [validate-source, deploy, deploy-railway]
    if: |
      always() &&
      needs.validate-source.result == 'success' &&
      needs.deploy-railway.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      ADMIN_WEB_URL: ${{ vars.ADMIN_WEB_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-source.outputs.source-sha }}

      - name: Validate smoke env configuration
        run: |
          if [[ -z "${ADMIN_WEB_URL}" || -z "${API_BASE_URL}" ]]; then
            echo "ERROR: ADMIN_WEB_URL or API_BASE_URL is not configured as a repository variable." >&2
            exit 1
          fi

      - name: Run admin smoke script
        run: bash scripts/smoke_admin_web.sh

  # admin-web is the only web frontend deployed from this repo. It is handled
  # by Vercel's native Git integration (project root: apps/admin-web,
  # production branch: main). That provider-side mutation happens outside this
  # workflow, so production promotion remains HOLD until an explicit Vercel
  # deployment-protection decision binds it to the same receipt authority.
