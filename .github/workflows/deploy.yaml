name: CD - Build & Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository_owner }}/selemene-engine
  IMAGE_NAME_TS: ${{ github.repository_owner }}/selemene-ts-engines

jobs:
  # Build and push Rust API Docker image
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # swisseph currently fails to compile on arm64 in this Docker build path
          # (libswisseph-sys pointer type mismatch under buildx/qemu). Keep deploys
          # deterministic on amd64 until arm64 toolchain/dependency parity is fixed.
          platforms: linux/amd64
      
      - name: Check image size
        run: |
          IMAGE_REF=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Inspecting image: ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"
          SIZE=$(docker image inspect "${IMAGE_REF}" --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 500 ]; then
            echo "::warning::Image size (${SIZE_MB}MB) exceeds 500MB target"
          fi

  # Build and push TypeScript engines Docker image
  build-ts-engines:
    name: Build TS Engines Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TS }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./ts-engines
          file: ./ts-engines/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Kubernetes — OPT-IN, and currently dormant.
  #
  # This cluster is not the live target: api.selemene.witnessos.io does not
  # resolve, and the running engine is served by Railway. The job previously ran
  # on every push and reported success while every step self-skipped for a
  # missing KUBECONFIG — a green tick for a deploy to a host that isn't there.
  # Enable it deliberately with vars.ENABLE_K8S_DEPLOY=true (and set KUBECONFIG),
  # at which point a missing kubeconfig is a hard failure.
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-api, build-ts-engines]
    if: |
      vars.ENABLE_K8S_DEPLOY == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ vars.K8S_ENVIRONMENT_URL }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
      
      # The job only runs when K8s deploys are explicitly enabled, so a missing
      # kubeconfig is a misconfiguration — not a reason to pass quietly.
      - name: Configure kubectl
        run: |
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "::error title=KUBECONFIG missing::vars.ENABLE_K8S_DEPLOY is true but no KUBECONFIG secret is set, so this job would report success without deploying."
            exit 1
          fi
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
      
      - name: Update image tags
        run: |
          cd k8s
          kustomize edit set image \
            ghcr.io/witnessos/selemene-engine=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:sha-${{ github.sha }} \
            ghcr.io/witnessos/selemene-ts-engines=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TS }}:sha-${{ github.sha }}
      
      - name: Render manifests
        run: |
          cd k8s
          kustomize build . > /tmp/manifests.yaml

      - name: Validate manifests
        run: |
          kubectl apply --dry-run=client -f /tmp/manifests.yaml

      - name: Deploy to cluster
        run: |
          cd k8s
          kustomize build . | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/selemene-api -n selemene --timeout=300s
          kubectl rollout status deployment/selemene-ts-engines -n selemene --timeout=300s

      - name: Verify deployment
        run: |
          # Check pods are running
          kubectl get pods -n selemene -l app=selemene

          # Check endpoints are ready
          kubectl get endpoints -n selemene

  # Deploy to Railway — the live engine's actual target.
  # Runs unless deploys are explicitly disabled (vars.DEPLOY_TARGET=none).
  # Missing credentials FAIL the job rather than skipping it silently.
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [build-api]
    if: |
      vars.DEPLOY_TARGET != 'none' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'Selemene-engine' }}
    steps:
      - uses: actions/checkout@v4

      # Railway serves the live engine (selemene.tryambakam.space). If its
      # credentials are absent this job used to `exit 0` — reporting a green
      # deploy while shipping nothing. That is exactly how a merged fix sat
      # unshipped behind an all-green CD run. A deploy that cannot deploy is a
      # failure, not a pass.
      - name: Validate Railway configuration
        run: |
          if [[ -z "${RAILWAY_TOKEN}" || -z "${RAILWAY_PROJECT_ID}" ]]; then
            echo "::error title=Railway not configured::RAILWAY_TOKEN and/or RAILWAY_PROJECT_ID are missing, so this run would report success while deploying nothing. Set them as repository secrets, or set vars.DEPLOY_TARGET=none to declare that this repo intentionally does not deploy."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway service
        run: |
          railway --version
          # RAILWAY_TOKEN here is a project token (environment-scoped — the
          # CI-recommended type). It CANNOT run `railway link`, which is an
          # account-level operation and 401s ("Unauthorized"). The token already
          # implies the project + environment, so deploy the target service
          # directly — railway up accepts --service without linking.
          railway up --service "${RAILWAY_SERVICE}" --ci

      - name: Verify Railway health
        env:
          HEALTH_BASE: ${{ vars.API_BASE_URL }}
        run: |
          # A project token can't run `railway status` to discover the .railway.app
          # URL (also an account op), so verify the real production endpoint
          # (custom domain) directly.
          BASE="${HEALTH_BASE:-https://selemene.tryambakam.space}"
          echo "Checking ${BASE}/health/live after deploy..."
          for attempt in {1..18}; do
            STATUS_CODE=$(curl -sS -o /tmp/railway-health.json -w "%{http_code}" "${BASE}/health/live" || echo "000")
            if [[ "${STATUS_CODE}" == "200" ]]; then
              echo "Health check passed on attempt ${attempt}."
              cat /tmp/railway-health.json
              exit 0
            fi
            echo "Attempt ${attempt}/18: health returned ${STATUS_CODE}; retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after retries."
          cat /tmp/railway-health.json || true
          exit 1

  # Post-deploy verification. Runs after the Railway deploy — the K8s job being
  # skipped (opt-in) must NOT cascade-skip this, or the mode-contract gate below
  # silently never runs, which is the very failure this file is closing.
  smoke-test:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy, deploy-railway]
    if: |
      always() &&
      needs.deploy-railway.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SMOKE_TEST_JWT: ${{ secrets.SMOKE_TEST_JWT }}
      SMOKE_TEST_API_KEY: ${{ secrets.SMOKE_TEST_API_KEY }}
      SKIP_SMOKE: ${{ vars.SKIP_SMOKE }}
    steps:
      - uses: actions/checkout@v4

      # A deploy with no post-deploy verification is a deploy you can't trust —
      # so missing config FAILS rather than skipping. Opt out deliberately with
      # vars.SKIP_SMOKE=true if this repo genuinely has nothing to verify.
      - name: Validate smoke env configuration
        id: smoke-gate
        run: |
          if [[ "${SKIP_SMOKE}" == "true" ]]; then
            echo "::warning title=Smoke skipped::vars.SKIP_SMOKE=true — post-deploy verification is explicitly disabled."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${API_BASE_URL}" || ( -z "${SMOKE_TEST_JWT}" && -z "${SMOKE_TEST_API_KEY}" ) ]]; then
            echo "::error title=Smoke not configured::A deploy ran but cannot be verified — set vars.API_BASE_URL and secrets.SMOKE_TEST_JWT (or SMOKE_TEST_API_KEY), or set vars.SKIP_SMOKE=true to opt out deliberately."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run API smoke runner
        if: steps.smoke-gate.outputs.skip != 'true'
        run: bash scripts/smoke-test-runner.sh "${API_BASE_URL}"

      # The mode contract is checked against the DEPLOYED engine, not just in
      # `cargo test`. Those drifted before and nobody noticed: /assets/generate
      # answered every mode with a generic "default: Reading", so a typo'd mode
      # was indistinguishable from a real reading and a whole fake surface looked
      # healthy. Unit tests can't catch "green locally, not shipped".
      - name: Verify mode contract on the deployed engine
        if: steps.smoke-gate.outputs.skip != 'true'
        env:
          ENGINE_URL: ${{ vars.API_BASE_URL }}
          # The engine takes a Bearer JWT or an X-API-Key; the gate uses whichever
          # is provided, so the Selemene API key works here too.
          ENGINE_TOKEN: ${{ secrets.SMOKE_TEST_JWT }}
          ENGINE_API_KEY: ${{ secrets.SMOKE_TEST_API_KEY }}
        run: node scripts/verify-mode-contract.mjs "${ENGINE_URL}"

  admin-smoke:
    name: Admin Smoke Checks
    runs-on: ubuntu-latest
    needs: [deploy, deploy-railway]
    if: |
      always() &&
      needs.deploy-railway.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      ADMIN_WEB_URL: ${{ vars.ADMIN_WEB_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate smoke env configuration
        run: |
          if [[ -z "${ADMIN_WEB_URL}" || -z "${API_BASE_URL}" ]]; then
            echo "ADMIN_WEB_URL or API_BASE_URL not configured as repository variables; skipping smoke checks."
            exit 0
          fi

      - name: Run admin smoke script
        if: env.ADMIN_WEB_URL != '' && env.API_BASE_URL != ''
        run: bash scripts/smoke_admin_web.sh

  # admin-web is the only web frontend deployed from this repo. It is
  # handled NATIVELY by Vercel via the GitHub integration (project root:
  # apps/admin-web, production branch: main). No CI job is needed here —
  # Vercel auto-builds + deploys on every push to main that touches the
  # relevant subdirectory. The previous custom `vercel build --prebuilt`
  # flow hit a monorepo path conflict and was blocking deploys for days;
  # the native Git integration sidesteps it entirely.

  # Create GitHub Release for tags
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Gate the release on the real deploy + verification, tolerating the opt-in
    # K8s job being skipped. Don't cut a release off an unverified deploy.
    needs: [build-api, deploy, deploy-railway, smoke-test, admin-smoke]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-api.result == 'success' &&
      needs.deploy-railway.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      needs.admin-smoke.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## Docker Images
            
            - API: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ github.ref_name }}`
            - TS Engines: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TS }}:${{ github.ref_name }}`
            
            ## Deploy
            
            ```bash
            # Pull latest images
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_TS }}:${{ github.ref_name }}
            
            # Or deploy to Kubernetes
            kubectl set image deployment/selemene-api \
              selemene-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ github.ref_name }} \
              -n selemene
            ```
