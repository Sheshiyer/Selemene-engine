name: Agent Merge Lane

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane to merge (qa-docs|backend|all)"
        required: false
        default: "qa-docs"
        type: choice
        options:
          - qa-docs
          - backend
          - all
      limit:
        description: "Max PRs to merge in this batch"
        required: false
        default: "5"
        type: string
      dry_run:
        description: "If true, report candidates without merging"
        required: false
        default: true
        type: boolean

jobs:
  merge_lane:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read

    steps:
      - name: Merge eligible agent PRs in lane
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const payloadInputs = context.payload && context.payload.inputs ? context.payload.inputs : {};
            const lane = payloadInputs.lane || 'qa-docs';
            const limitInput = payloadInputs.limit === undefined ? '5' : payloadInputs.limit;
            const dryRunInput = payloadInputs.dry_run === undefined ? 'true' : String(payloadInputs.dry_run).toLowerCase();
            if (!['true', 'false'].includes(dryRunInput)) {
              core.setFailed('dry_run must be true or false.');
              return;
            }
            const dryRun = dryRunInput === 'true';
            const { owner, repo } = context.repo;
            const repoFullName = `${owner}/${repo}`;
            const allowedLanes = ['qa-docs', 'backend', 'all'];

            if (!allowedLanes.includes(lane)) {
              core.setFailed(`Invalid lane "${lane}". Allowed lanes are: ${allowedLanes.join(', ')}`);
              return;
            }

            const limitText = String(limitInput).trim();
            if (!/^[0-9]+$/.test(limitText)) {
              core.setFailed(`Invalid limit "${limitInput}". Must be an integer between 1 and 25.`);
              return;
            }

            const limit = parseInt(limitText, 10);
            if (!Number.isInteger(limit) || limit < 1 || limit > 25) {
              core.setFailed(`Invalid limit "${limitInput}". Must be an integer between 1 and 25.`);
              return;
            }

            function issueNumFromHead(headRef) {
              const m = /^agent\/issue-(\d+)-/.exec(headRef || '');
              return m ? parseInt(m[1], 10) : null;
            }

            function laneForArea(area) {
              if (area === 'area:qa' || area === 'area:docs') return 'qa-docs';
              if (area === 'area:backend' || area === 'area:data') return 'backend';
              return 'all';
            }

            function isMergeCandidateReady(prData, capturedHeadSha) {
              return (
                prData &&
                prData.state === 'open' &&
                !prData.draft &&
                prData.head &&
                prData.head.sha === capturedHeadSha &&
                prData.base &&
                (prData.base.ref === 'main' || prData.base.ref === 'develop') &&
                prData.head.repo &&
                prData.head.repo.full_name === repoFullName &&
                prData.mergeable === true &&
                prData.mergeable_state === 'clean'
              );
            }

            async function hasPassingCiGate(headSha) {
              try {
                const checks = await github.paginate(github.rest.checks.listForRef, {
                  owner,
                  repo,
                  ref: headSha,
                  per_page: 100,
                });

                const ciGateChecks = (checks || []).filter((check) => {
                  const app = check && check.app ? check.app : null;
                  return (
                    check &&
                    check.name === 'CI Gate' &&
                    check.head_sha === headSha &&
                    app &&
                    app.id === 15368
                  );
                });

                if (!ciGateChecks.length) {
                  return { ok: false, reason: 'Missing CI Gate check for this commit.' };
                }

                ciGateChecks.sort((a, b) => b.id - a.id);
                const latest = ciGateChecks[0];

                if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
                  return {
                    ok: false,
                    reason: `Latest CI Gate check is not completed + success (status=${latest ? latest.status : 'unknown'}, conclusion=${latest ? latest.conclusion : 'unknown'})`
                  };
                }

                return { ok: true };
              } catch (e) {
                return { ok: false, reason: `Could not verify checks: ${e.message}` };
              }
            }

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const agentPulls = pulls.filter(p => p.head.ref.startsWith('agent/issue-'));
            const candidates = [];
            const merged = [];
            const failed = [];

            for (const pr of agentPulls) {
              if (pr.draft) continue;
              const issueNum = issueNumFromHead(pr.head.ref);
              if (!issueNum) continue;

              let area = '';
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNum });
                const labels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name);
                area = labels.find(l => l.startsWith('area:')) || '';
              } catch (e) {
                core.warning(`Could not load issue #${issueNum} for PR #${pr.number}: ${e.message}`);
                continue;
              }

              const prLane = laneForArea(area);
              if (lane !== 'all' && prLane !== lane) continue;

              const capturedHeadSha = pr.head.sha;

              let currentPr;
              try {
                const { data: freshPr } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
                currentPr = freshPr;
              } catch (e) {
                core.warning(`Could not refresh PR #${pr.number} before checks: ${e.message}`);
                continue;
              }

              if (!isMergeCandidateReady(currentPr, capturedHeadSha)) {
                core.warning(`Skipping PR #${pr.number}: not in expected mergeable state`);
                continue;
              }

              const checksResult = await hasPassingCiGate(capturedHeadSha);
              if (!checksResult.ok) {
                core.warning(`Skipping PR #${pr.number}: ${checksResult.reason}`);
                continue;
              }

              candidates.push({
                number: pr.number,
                title: pr.title,
                headSha: capturedHeadSha,
                issueNum,
                area,
                lane: prLane,
              });
            }

            candidates.sort((a, b) => a.number - b.number);
            const batch = candidates.slice(0, limit);

            core.notice(`Lane=${lane} dry_run=${dryRun} eligible=${candidates.length} merging=${batch.length}`);
            if (!batch.length) {
              core.summary.addHeading('Agent Merge Lane').addRaw('No eligible non-draft PRs for this lane.', true).write();
              return;
            }

            for (const item of batch) {
              let refreshedPr;
              try {
                const { data: freshPull } = await github.rest.pulls.get({ owner, repo, pull_number: item.number });
                refreshedPr = freshPull;
              } catch (e) {
                failed.push({ ...item, error: `Could not re-read PR #${item.number}: ${e.message}` });
                continue;
              }

              if (!isMergeCandidateReady(refreshedPr, item.headSha)) {
                failed.push({ ...item, error: 'PR state changed after checks.' });
                continue;
              }

              const finalChecks = await hasPassingCiGate(item.headSha);
              if (!finalChecks.ok) {
                failed.push({ ...item, error: finalChecks.reason });
                continue;
              }

              if (dryRun) {
                merged.push({ ...item, dryRun: true });
                continue;
              }

              try {
                const { data: mergeResult } = await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: item.number,
                  merge_method: 'squash',
                  sha: item.headSha,
                  commit_title: `[agent][${item.lane}] ${item.title}`,
                });

                if (!mergeResult || mergeResult.merged !== true) {
                  failed.push({ ...item, error: `Merge API did not return merged=true` });
                  continue;
                }

                merged.push(item);
              } catch (e) {
                failed.push({ ...item, error: e.message });
              }
            }

            const summary = core.summary.addHeading('Agent Merge Lane Batch');
            summary.addRaw(`- Lane: ${lane}\n`, true);
            summary.addRaw(`- Dry run: ${dryRun}\n`, true);
            summary.addRaw(`- Eligible: ${candidates.length}\n`, true);
            summary.addRaw(`- Attempted: ${batch.length}\n`, true);
            summary.addRaw(`- Merged: ${merged.length}\n`, true);
            summary.addRaw(`- Failed: ${failed.length}\n`, true);

            if (merged.length) {
              summary.addHeading('Merged').addCodeBlock(
                merged.map(m => `#${m.number} issue=#${m.issueNum} area=${m.area} lane=${m.lane}${m.dryRun ? ' (dry-run)' : ''}`).join('\n')
              );
            }
            if (failed.length) {
              summary.addHeading('Failed').addCodeBlock(
                failed.map(f => `#${f.number} issue=#${f.issueNum} area=${f.area} error=${f.error}`).join('\n')
              );
            }

            await summary.write();
