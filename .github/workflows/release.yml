name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository_owner }}/selemene-engine
  IMAGE_NAME_TS: ${{ github.repository_owner }}/selemene-ts-engines

jobs:
  # Gate: the same complete CI suite must pass before release artifacts are built.
  pre-release-tests:
    name: Pre-release test gate
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # Resolve the immutable images already published by the main deployment
  # workflow. This job performs registry reads only; it does not create or move
  # a tag.
  resolve-release-artifacts:
    name: Resolve immutable release artifacts
    runs-on: ubuntu-latest
    needs: pre-release-tests
    permissions:
      contents: read
      packages: read
    outputs:
      api-digest: ${{ steps.resolve.outputs.api-digest }}
      ts-digest: ${{ steps.resolve.outputs.ts-digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source-tag digests
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          resolve_digest() {
            local image_ref="$1"
            local digest
            digest="$(docker buildx imagetools inspect "${image_ref}" | awk '$1 == "Digest:" { print $2; exit }')"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error title=Artifact digest unavailable::Could not resolve an immutable digest for ${image_ref}."
              exit 1
            fi
            printf '%s' "${digest}"
          }
          api_ref="${REGISTRY}/${IMAGE_NAME_API}:sha-${GITHUB_SHA}"
          ts_ref="${REGISTRY}/${IMAGE_NAME_TS}:sha-${GITHUB_SHA}"
          echo "api-digest=$(resolve_digest "${api_ref}")" >> "$GITHUB_OUTPUT"
          echo "ts-digest=$(resolve_digest "${ts_ref}")" >> "$GITHUB_OUTPUT"

  # Release publication is denied until a reviewed immutable-image receipt is
  # bound to the tag source, exact registry-read digests and manifest-owned
  # production target. Test fixtures are rejected even when internally valid.
  validate-release-receipt:
    name: Validate Release Receipt
    runs-on: ubuntu-latest
    needs: [pre-release-tests, resolve-release-artifacts]
    env:
      RELEASE_RECEIPT_B64: ${{ vars.PUBLISH_RELEASE_RECEIPT_B64 }}
      EXPECTED_API_DIGEST: ${{ needs.resolve-release-artifacts.outputs.api-digest }}
      EXPECTED_TS_DIGEST: ${{ needs.resolve-release-artifacts.outputs.ts-digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Materialize candidate release receipt
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_RECEIPT_B64:-}" ]]; then
            echo "::error title=Release receipt missing::Set vars.PUBLISH_RELEASE_RECEIPT_B64 to a reviewed v1 release-production receipt for this exact source revision and registry-read digests."
            exit 1
          fi
          umask 077
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "selemene-release-receipt.json").write_bytes(base64.b64decode(os.environ["RELEASE_RECEIPT_B64"], validate=True))'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install receipt validator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-gates.txt

      - name: Validate source-bound release receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_release_receipt.py \
            "$RUNNER_TEMP/selemene-release-receipt.json" \
            --expected-source "$GITHUB_SHA" \
            --expected-release-tag "$GITHUB_REF_NAME" \
            --expected-operation-id "github-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --expected-workflow .github/workflows/release.yml \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --required-promotion-mode immutable-image \
            --target-profile release-production \
            --expected-artifact-digest "api=${EXPECTED_API_DIGEST}" \
            --expected-artifact-digest "typescript-engines=${EXPECTED_TS_DIGEST}" \
            --operational

  # The repository cannot prove atomic alias movement across both GHCR
  # repositories or compensate a later GitHub-release failure. Keep the
  # production mutation absent until the manifest's required authority exists.
  release-result:
    name: Production Release Hold
    runs-on: ubuntu-latest
    needs: [validate-release-receipt, resolve-release-artifacts]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Enforce atomic promotion hold
        shell: bash
        run: |
          set -euo pipefail
          echo "::error title=Production release held::No aliases or GitHub release were changed. Authorization requires durable one-use receipt consumption and atomic multi-registry alias promotion with compensation."
          exit 1
