name: Agent Issue Dispatch

# Trigger: when an issue gets labeled 'agent-ready'
# Effect: creates a branch + draft PR pre-populated with full agent context
# The PR body is formatted as a structured agent prompt with acceptance criteria

on:
  issues:
    types: [labeled]

jobs:
  dispatch:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Derive branch name
        id: branch
        run: |
          ISSUE_NUM="${{ github.event.issue.number }}"
          TITLE="${{ github.event.issue.title }}"
          # slug: lowercase, replace non-alphanumeric with dash, truncate to 50 chars
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//' | cut -c1-50)
          BRANCH="agent/issue-${ISSUE_NUM}-${SLUG}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "issue_num=$ISSUE_NUM" >> "$GITHUB_OUTPUT"

      - name: Write agent task file via script (safe from injection)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const num = issue.number;

            fs.mkdirSync('.agent-tasks', { recursive: true });

            const content = [
              `# Agent Task: Issue #${num}`,
              ``,
              `> Auto-generated by agent-dispatch workflow. Delete this file before merging.`,
              ``,
              `## Issue`,
              `**Title:** ${issue.title}`,
              `**URL:** ${issue.html_url}`,
              ``,
              `## Body`,
              issue.body || '_No body provided._',
              ``,
              `## Agent Instructions`,
              `1. Read this file fully before writing any code.`,
              `2. Implement everything in the **Deliverable** section above.`,
              `3. Verify every item in the **Acceptance Criteria** section.`,
              `4. Run \`cargo build && cargo test\` (or the relevant test command) and confirm passing.`,
              `5. Delete \`.agent-tasks/issue-${num}.md\` when done.`,
              `6. Mark the PR ready for review (remove draft status).`,
              ``,
              `## Done Signal`,
              `Post a comment: \`agent: done — tests passing, ready for review\``,
            ].join('\n');

            fs.writeFileSync(`.agent-tasks/issue-${num}.md`, content);

      - name: Commit and push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.branch.outputs.branch }}"
          git add .agent-tasks/
          git commit -m "chore(agent): scaffold task file for issue #${{ steps.branch.outputs.issue_num }}"
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Create draft PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const branch = "${{ steps.branch.outputs.branch }}";

            const labels = issue.labels.map(l => l.name);
            const area = labels.find(l => l.startsWith('area:')) || 'area:backend';
            const wave = labels.find(l => l.startsWith('wave:')) || '';
            const phase = labels.find(l => l.startsWith('phase:')) || '';

            const body = `## Agent PR — Issue #${issue.number}

            > Auto-created by [agent-dispatch workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/agent-dispatch.yml) when \`agent-ready\` label was applied.
            > **Do not merge manually.** The agent will mark this ready for review when done.

            ---

            ### Task
            **${issue.title}**

            ${issue.body || '_No body provided._'}

            ---

            ### Metadata
            | Field | Value |
            |-------|-------|
            | Issue | Closes #${issue.number} |
            | Area | \`${area}\` |
            | Wave | \`${wave}\` |
            | Phase | \`${phase}\` |
            | Branch | \`${branch}\` |

            ---

            ### Agent Checklist
            - [ ] Deliverable implemented per issue spec
            - [ ] Acceptance criteria verified
            - [ ] \`cargo build\` succeeds
            - [ ] All tests pass
            - [ ] \`.agent-tasks/issue-${issue.number}.md\` deleted
            - [ ] PR marked ready for review
            `;

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[agent] ${issue.title}`,
              head: branch,
              base: 'main',
              body: body,
              draft: true,
            });

            // Comment on the issue with the PR link
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `🤖 Agent dispatch: Draft PR created → ${pr.data.html_url}\n\nBranch: \`${branch}\`\nThe agent will implement this issue and mark the PR ready when done.`,
            });

            return pr.data.number;
