name: Agent Issue Dispatch

# Trigger A: issue labeled 'agent-ready' -> creates branch + draft PR for that issue
# Trigger B: workflow_dispatch (manual backfill) -> processes all open agent-ready issues
#            or a specific comma-separated list if issue_numbers is provided

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_numbers:
        description: "Comma-separated issue numbers (e.g. 368,369,370). Empty = all open agent-ready issues."
        required: false
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Dispatch issues to agent PRs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          COPILOT_AUTOKICK: ${{ vars.COPILOT_AUTOKICK || 'true' }}
        with:
          script: |
            const { owner, repo } = context.repo;

            // ── Helpers ──────────────────────────────────────────────────────────

            function slugify(title) {
              return title
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '')
                .slice(0, 50);
            }

            async function hasAgentPR(issueNum) {
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, state: 'open', per_page: 100,
              });
              return prs.some(p => p.head.ref.startsWith(`agent/issue-${issueNum}-`));
            }

            async function createAgentPR(issue) {
              const num = issue.number;
              const branch = `agent/issue-${num}-${slugify(issue.title)}`;

              if (await hasAgentPR(num)) {
                console.log(`#${num}: already has an agent PR -- skipping`);
                return;
              }

              // Get HEAD SHA of main
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
              const headSha = ref.object.sha;

              // Build agent task file content
              const labels = (issue.labels || []).map(l => l.name);
              const area  = labels.find(l => l.startsWith('area:'))  || '';
              const wave  = labels.find(l => l.startsWith('wave:'))  || '';
              const phase = labels.find(l => l.startsWith('phase:')) || '';

              const taskContent = [
                `# Agent Task: Issue #${num}`,
                ``,
                `> Auto-generated by agent-dispatch. Delete this file before the PR is merged.`,
                ``,
                `## Issue`,
                `**Title:** ${issue.title}`,
                `**URL:** ${issue.html_url}`,
                ``,
                `## Specification`,
                issue.body || '_No body provided._',
                ``,
                `## Agent Instructions`,
                `1. Read this file fully before writing any code.`,
                `2. Implement everything in the Deliverable section above.`,
                `3. Satisfy every item in the Acceptance Criteria section.`,
                `4. Run cargo build && cargo test and confirm all tests pass.`,
                `5. Delete .agent-tasks/issue-${num}.md when done.`,
                `6. Convert this PR from draft to ready-for-review.`,
                ``,
                `## Done Signal`,
                `Post a PR comment: agent: done -- tests passing, ready for review`,
              ].join('\n');

              // Create blob for the task file
              const { data: blob } = await github.rest.git.createBlob({
                owner, repo,
                content: Buffer.from(taskContent).toString('base64'),
                encoding: 'base64',
              });

              // Get current tree of HEAD and create new tree with task file
              const { data: commit } = await github.rest.git.getCommit({ owner, repo, commit_sha: headSha });
              const { data: tree } = await github.rest.git.createTree({
                owner, repo,
                base_tree: commit.tree.sha,
                tree: [{
                  path: `.agent-tasks/issue-${num}.md`,
                  mode: '100644',
                  type: 'blob',
                  sha: blob.sha,
                }],
              });

              // Create commit on new branch
              const { data: newCommit } = await github.rest.git.createCommit({
                owner, repo,
                message: `chore(agent): scaffold task file for issue #${num}`,
                tree: tree.sha,
                parents: [headSha],
              });

              // Create the branch
              await github.rest.git.createRef({
                owner, repo,
                ref: `refs/heads/${branch}`,
                sha: newCommit.sha,
              });

              // Build PR body
              const prBody = [
                `## Agent PR -- Issue #${num}`,
                ``,
                `> Auto-created by [agent-dispatch](https://github.com/${owner}/${repo}/actions/workflows/agent-dispatch.yml) when \`agent-ready\` label was applied.`,
                `> **Do not merge manually.** The agent marks this ready for review when complete.`,
                ``,
                `---`,
                ``,
                `### Task`,
                `**${issue.title}**`,
                ``,
                issue.body || '_No body provided._',
                ``,
                `---`,
                ``,
                `### Metadata`,
                `| Field | Value |`,
                `|-------|-------|`,
                `| Closes | #${num} |`,
                `| Area | \`${area}\` |`,
                `| Wave | \`${wave}\` |`,
                `| Phase | \`${phase}\` |`,
                `| Branch | \`${branch}\` |`,
                ``,
                `### Agent Checklist`,
                `- [ ] Deliverable implemented per issue spec`,
                `- [ ] All acceptance criteria verified`,
                `- [ ] \`cargo build\` succeeds`,
                `- [ ] All tests pass (\`cargo test\`)`,
                `- [ ] \`.agent-tasks/issue-${num}.md\` deleted`,
                `- [ ] PR marked ready for review`,
              ].join('\n');

              // Open draft PR
              const { data: pr } = await github.rest.pulls.create({
                owner, repo,
                title: `[agent] ${issue.title}`,
                head: branch,
                base: 'main',
                body: prBody,
                draft: true,
              });

              // Kick GitHub Copilot coding agent on the new draft PR (toggle via repo var COPILOT_AUTOKICK)
              const autoKick = (process.env.COPILOT_AUTOKICK || 'true').toLowerCase() === 'true';
              if (autoKick) {
                const kickBody = [
                  `@copilot Implement everything in \`.agent-tasks/issue-${num}.md\`.`,
                  ``,
                  `Acceptance:`,
                  `- All items in the issue's Acceptance Criteria pass`,
                  `- \`cargo build && cargo test\` is green`,
                  `- Delete \`.agent-tasks/issue-${num}.md\` in your final commit`,
                  `- Convert this PR from draft to ready-for-review`,
                  `- Post \`agent: done -- tests passing, ready for review\``,
                ].join('\n');
                await github.rest.issues.createComment({
                  owner, repo,
                  issue_number: pr.number,
                  body: kickBody,
                });
                console.log(`#${num}: posted @copilot kickoff on PR #${pr.number}`);
              } else {
                console.log(`#${num}: COPILOT_AUTOKICK disabled, skipping @copilot kickoff`);
              }

              // Comment on the source issue
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: num,
                body: `🤖 **Agent dispatch:** Draft PR created -> ${pr.html_url}\n\nBranch: \`${branch}\`\n\nThe agent will implement this issue and convert to ready-for-review when done.`,
              });

              console.log(`#${num}: created draft PR #${pr.number} -> ${branch}`);
            }

            // ── Route by trigger ─────────────────────────────────────────────────

            if (context.eventName === 'issues') {
              if (context.payload.label.name !== 'agent-ready') return;
              await createAgentPR(context.payload.issue);

            } else if (context.eventName === 'workflow_dispatch') {
              const input = (context.payload.inputs?.issue_numbers || '').trim();
              let issues;

              if (input) {
                const nums = input.split(',').map(n => parseInt(n.trim(), 10)).filter(Boolean);
                issues = await Promise.all(
                  nums.map(n =>
                    github.rest.issues.get({ owner, repo, issue_number: n }).then(r => r.data)
                  )
                );
              } else {
                const { data } = await github.rest.issues.listForRepo({
                  owner, repo, state: 'open', labels: 'agent-ready', per_page: 100,
                });
                issues = data;
              }

              console.log(`Backfill: ${issues.length} issues`);
              for (const issue of issues) {
                await createAgentPR(issue);
                await new Promise(r => setTimeout(r, 1500));
              }
            }
