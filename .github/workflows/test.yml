name: CI - Test & Lint

on:
  workflow_call:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  repository-gate:
    name: Workspace Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: 1.3.13

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install repository gate dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-gates.txt

      - name: Install workspace dependencies
        run: |
          pnpm install --frozen-lockfile
          cd ts-engines
          bun install --frozen-lockfile

      - name: Validate workflow action pins
        run: python scripts/validate_action_pins.py

      - name: Run canonical repository gate
        run: pnpm run gate

  # Run all linting checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      
      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  workflow-parity:
    name: Workflow Registry Parity
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run workflow parity tests
        run: cargo test -p noesis-api workflow_parity -- --nocapture

      - name: Validate workflow parity CLI
        run: cargo run -p noesis-api --bin validate_workflow_parity

      - name: Witness prompt contract
        run: cargo test -p noesis-integration --test witness_prompt_quality_tests -- --nocapture

  # Run unit tests
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, workflow-parity]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: noesis_test
          POSTGRES_USER: noesis_test
          POSTGRES_PASSWORD: noesis_test_password
        options: >-
          --health-cmd "pg_isready -U noesis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Apply database migrations
        run: >-
          bash scripts/apply-migrations.sh --migrations-dir migrations --
          --host localhost --username noesis_test --dbname noesis_test
        env:
          PGPASSWORD: noesis_test_password

      - name: Run unit tests
        run: cargo test --lib
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://noesis_test:noesis_test_password@localhost:5432/noesis_test

      - name: Dry-run config audit
        run: cargo run -p noesis-api --bin validate_config -- --dry-run
        env:
          RUST_ENV: development
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://noesis_test:noesis_test_password@localhost:5432/noesis_test

      - name: Run doc tests
        run: cargo test --doc

  # Run integration tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: noesis_test
          POSTGRES_USER: noesis_test
          POSTGRES_PASSWORD: noesis_test_password
        options: >-
          --health-cmd "pg_isready -U noesis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Apply database migrations
        run: >-
          bash scripts/apply-migrations.sh --migrations-dir migrations --
          --host localhost --username noesis_test --dbname noesis_test
        env:
          PGPASSWORD: noesis_test_password

      - name: Run integration tests
        run: cargo test --test '*' -- --test-threads=1
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://noesis_test:noesis_test_password@localhost:5432/noesis_test

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit

  # Secret scanning
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@30a032af512f08a1d4e7d1aaf0d4119ad6910d63 # main
        with:
          extra_args: --only-verified

  # Build check
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      
      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Build release
        run: cargo build --release --bin noesis-server
      
      - name: Check binary size
        run: |
          BINARY_SIZE=$(stat -c%s target/release/noesis-server || echo "0")
          echo "Binary size: $BINARY_SIZE bytes"
          echo "Binary size: $(numfmt --to=iec-i --suffix=B "$BINARY_SIZE")"

  # TypeScript engines lint and test
  ts-engines:
    name: TS Engines
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-engines
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: 1.3.13
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Lint
        run: bun run lint
      
      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck
 
      - name: P1 W2 / T-020 media contract smoke (TS server + roundtrip; raaga/strudel T-005, sigil image via provider T-003; use frozen samples; cite extraction + FROZEN + bootstrap)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          bun run start &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "=== HEALTH ==="
          ready=0
          for attempt in {1..20}; do
            if curl --fail-with-body --show-error --silent \
                --output "$RUNNER_TEMP/ts-health.json" \
                http://localhost:3001/health \
              && jq -e '.status == "healthy"' "$RUNNER_TEMP/ts-health.json" >/dev/null; then
              ready=1
              break
            fi
            echo "TS engine readiness attempt ${attempt}/20 failed"
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "TS engine did not become healthy within 20 seconds" >&2
            exit 1
          fi
          jq -c '{status, engines, version}' "$RUNNER_TEMP/ts-health.json"

          echo "=== RAAGA (strudel audio per T-005 FROZEN; refs bootstrap + resources-and-assets + gaps + goal-understanding + P1W1-CONTRACTS-FROZEN) ==="
          curl --fail-with-body --show-error --silent \
            --output "$RUNNER_TEMP/raaga.json" \
            -X POST http://localhost:3001/engines/raaga/calculate \
            -H 'Content-Type: application/json' \
            -d '{"consciousness_level":2,"parameters":{"melakarta":1},"consent":{"granted":true,"scopes":["raaga-audio"],"timestamp":"2026-07-17T12:00:00Z"}}'
          jq -e '
            .engine_id == "raaga" and
            .result.melakarta.num == 1 and
            (.generated_audio.strudel_ratios | type == "array" and length == 8) and
            .generated_audio.metadata.engine == "raaga"
          ' "$RUNNER_TEMP/raaga.json"

          echo "=== SIGIL (deterministic guidance-only contract; provider media remains separately mocked/config-gated per T-003 FROZEN) ==="
          curl --fail-with-body --show-error --silent \
            --output "$RUNNER_TEMP/sigil.json" \
            -X POST http://localhost:3001/engines/sigil-forge/calculate \
            -H 'Content-Type: application/json' \
            -d '{"consciousness_level":1,"parameters":{"intention":"witness patterns"},"consent":{"granted":true,"scopes":["sigil-gen"],"timestamp":"2026-07-17T12:00:00Z"}}'
          jq -e '
            .engine_id == "sigil-forge" and
            (.result.method.id | type == "string" and length > 0) and
            .result.svg_preview.status == "absent" and
            .result.generated_image == null
          ' "$RUNNER_TEMP/sigil.json"


  # P1 W1 Python sidecar smoke (biofield CV for capture contracts T-004; refs extraction + bootstrap + FROZEN)
  python-sidecars:
    name: Python Sidecars (P1 W1 biofield contract smoke)
    runs-on: ubuntu-latest
    needs: [ts-engines]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install python-services (biofield + dev)
        run: |
          cd python-services
          python -m pip install uv==0.7.13
          uv sync --locked --extra dev
          # opencv-headless etc pulled by pyproject

      - name: Pytest contract shapes (11 metrics, quality, analyze)
        run: |
          cd python-services
          uv run --locked --extra dev python -m pytest tests -q --tb=line

      - name: Biofield sidecar smoke (health + basic /analyze contract)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          cd python-services
          uv run --locked --extra dev python -m uvicorn biofield_cv_service.main:app --host 127.0.0.1 --port 8002 --log-level error &
          UV_PID=$!
          cleanup() {
            kill "$UV_PID" 2>/dev/null || true
            wait "$UV_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "=== BIOFIELD HEALTH (T-004 capture contract) ==="
          ready=0
          for attempt in {1..20}; do
            if curl --fail-with-body --show-error --silent --max-time 3 \
                --output "$RUNNER_TEMP/biofield-health.json" \
                http://127.0.0.1:8002/health \
              && jq -e '
                .status == "healthy" and
                .service == "biofield-cv" and
                .opencv_available == true and
                .numpy_available == true
              ' "$RUNNER_TEMP/biofield-health.json" >/dev/null; then
              ready=1
              break
            fi
            echo "Biofield readiness attempt ${attempt}/20 failed"
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "Biofield sidecar did not become ready within 20 seconds" >&2
            exit 1
          fi

          export BIOFIELD_SMOKE_IMAGE="$RUNNER_TEMP/biofield-smoke.png"
          uv run --locked --extra dev python - <<'PY'
          import os
          import cv2
          import numpy as np

          image = np.zeros((64, 64, 3), dtype=np.uint8)
          cv2.circle(image, (32, 32), 20, (180, 160, 140), -1)
          cv2.rectangle(image, (20, 32), (44, 60), (160, 140, 120), -1)
          if not cv2.imwrite(os.environ["BIOFIELD_SMOKE_IMAGE"], image):
              raise SystemExit("failed to write biofield smoke fixture")
          PY

          echo "=== BIOFIELD ANALYZE (dual-biofield real-cv/v1 + 11 metrics) ==="
          curl --fail-with-body --show-error --silent --max-time 30 \
            --output "$RUNNER_TEMP/biofield-analyze.json" \
            -X POST http://127.0.0.1:8002/analyze \
            -F "image=@$BIOFIELD_SMOKE_IMAGE;type=image/png"
          jq -e '
            .contract_version == "biofield-cv/v1" and
            .analysis_version == "real-cv/v1" and
            (.metrics | keys | length == 11) and
            (.metrics.light_quanta_density | type == "number") and
            (.metrics.energy_analysis.low | type == "number") and
            (.metrics.fractal_dimension | type == "number") and
            (.metrics.body_symmetry | type == "number") and
            (.algorithms_run | length == 11) and
            (.quality_assessment.sufficient_quality | type == "boolean") and
            (.processing_time_ms | type == "number")
          ' "$RUNNER_TEMP/biofield-analyze.json"

  python-images:
    name: Python Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [biofield,mediapipe]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Build and validate imports
        run: |
          docker build --pull --file python-services/Dockerfile.${{ matrix.service }} --tag selemene-python-${{ matrix.service }}:ci python-services
          if [[ "${{ matrix.service }}" == "biofield" ]]; then
            docker run --rm --entrypoint python selemene-python-${{ matrix.service }}:ci -c "import cv2, numpy, biofield_cv_service.main; print('sidecar imports passed')"
          elif [[ "${{ matrix.service }}" == "mediapipe" ]]; then
            docker run --rm --entrypoint python selemene-python-${{ matrix.service }}:ci -c "import cv2, numpy, mediapipe, mediapipe_service.main; print('sidecar imports passed')"
          else
            echo "Unknown Python sidecar service: ${{ matrix.service }}" >&2
            exit 1
          fi

  admin-web:
    name: Required Admin Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Setup workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @noesis/sdk prerequisite
        run: pnpm --filter @noesis/sdk run build

      - name: Build admin web
        run: pnpm -C apps/admin-web run build

      - name: Run admin web lint
        run: pnpm -C apps/admin-web run lint

      - name: Run admin web typecheck
        run: pnpm -C apps/admin-web run typecheck

      - name: Run admin web tests
        run: pnpm -C apps/admin-web run test

  node-security:
    name: Node Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production and development dependencies
        run: pnpm audit --audit-level=high

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - repository-gate
      - lint
      - workflow-parity
      - test
      - integration
      - security
      - secrets
      - build
      - ts-engines
      - python-sidecars
      - admin-web
      - node-security
      - python-images
    steps:
      - name: Require every CI lane to succeed
        env:
          REPOSITORY_GATE: ${{ needs.repository-gate.result }}
          LINT: ${{ needs.lint.result }}
          WORKFLOW_PARITY: ${{ needs.workflow-parity.result }}
          TEST: ${{ needs.test.result }}
          INTEGRATION: ${{ needs.integration.result }}
          SECURITY: ${{ needs.security.result }}
          SECRETS: ${{ needs.secrets.result }}
          BUILD: ${{ needs.build.result }}
          TS_ENGINES: ${{ needs.ts-engines.result }}
          PYTHON_SIDECARS: ${{ needs.python-sidecars.result }}
          PYTHON_IMAGES: ${{ needs.python-images.result }}
          ADMIN_WEB: ${{ needs.admin-web.result }}
          NODE_SECURITY: ${{ needs.node-security.result }}
        run: |
          failed=0
          for result_name in \
            REPOSITORY_GATE LINT WORKFLOW_PARITY TEST INTEGRATION \
            SECURITY SECRETS BUILD TS_ENGINES PYTHON_SIDECARS PYTHON_IMAGES ADMIN_WEB NODE_SECURITY; do
            result="${!result_name}"
            echo "${result_name}=${result}"
            if [[ "${result}" != "success" ]]; then
              failed=1
            fi
          done
          if ((failed != 0)); then
            echo "::error::One or more required CI lanes did not succeed."
            exit 1
          fi
