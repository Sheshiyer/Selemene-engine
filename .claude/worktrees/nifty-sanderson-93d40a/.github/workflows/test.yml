name: CI - Test & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Run all linting checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Setup cache
        uses: Swatinem/rust-cache@v2
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  workflow-parity:
    name: Workflow Registry Parity
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Run workflow parity tests
        run: cargo test -p noesis-api workflow_parity -- --nocapture

      - name: Validate workflow parity CLI
        run: cargo run -p noesis-api --bin validate_workflow_parity

  # Run unit tests
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, workflow-parity]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: noesis_test
          POSTGRES_USER: noesis_test
          POSTGRES_PASSWORD: noesis_test_password
        options: >-
          --health-cmd "pg_isready -U noesis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Apply database migrations
        run: |
          for migration in migrations/*.sql; do
            if [ -f "$migration" ]; then
              PGPASSWORD=noesis_test_password psql -h localhost -U noesis_test -d noesis_test -f "$migration" || true
            fi
          done
        env:
          PGPASSWORD: noesis_test_password

      - name: Run unit tests
        run: cargo test --lib
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://noesis_test:noesis_test_password@localhost:5432/noesis_test

      - name: Dry-run config audit
        run: cargo run -p noesis-api --bin validate_config -- --dry-run
        env:
          RUST_ENV: development
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://noesis_test:noesis_test_password@localhost:5432/noesis_test

      - name: Run doc tests
        run: cargo test --doc

  # Run integration tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: noesis_test
          POSTGRES_USER: noesis_test
          POSTGRES_PASSWORD: noesis_test_password
        options: >-
          --health-cmd "pg_isready -U noesis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Apply database migrations
        run: |
          for migration in migrations/*.sql; do
            if [ -f "$migration" ]; then
              PGPASSWORD=noesis_test_password psql -h localhost -U noesis_test -d noesis_test -f "$migration" || true
            fi
          done

      - name: Run integration tests
        run: cargo test --test '*' -- --test-threads=1
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://noesis_test:noesis_test_password@localhost:5432/noesis_test
        continue-on-error: true

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit

  # Secret scanning
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # Build check
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Setup cache
        uses: Swatinem/rust-cache@v2
      
      - name: Build release
        run: cargo build --release --bin noesis-server
      
      - name: Check binary size
        run: |
          BINARY_SIZE=$(stat -c%s target/release/noesis-server || echo "0")
          echo "Binary size: $BINARY_SIZE bytes"
          echo "Binary size: $(numfmt --to=iec-i --suffix=B $BINARY_SIZE)"

  # TypeScript engines lint and test
  ts-engines:
    name: TS Engines
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-engines
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Lint
        run: bun run lint
      
      - name: Run tests
        run: bun test
