[build]
# Use Nixpacks builder (auto-detects Bun)
builder = "NIXPACKS"
# Dockerfile is in the current directory (when root is /ts-engines)
dockerfilePath = "Dockerfile"

[deploy]
# Start command (Dockerfile already defines this)
# startCommand = "bun run src/index.ts"

# Healthcheck endpoint
healthcheckPath = "/health"
healthcheckTimeout = 60

# Restart policy - restart on failure
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.watch]
# Watch paths - relative to /ts-engines
include = [
  "src/**",
  "package.json",
  "bun.lock",
  "Dockerfile",
  "railway.toml",
  "railway.json"
]

# Ignore
exclude = [
  "tests/**",
  "*.md"
]
